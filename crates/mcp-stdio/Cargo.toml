[package]
name = "mcp-stdio"
version = "0.0.1"
description = "MCP stdio framing primitives + sidecar identity helpers (newline-delimited JSON-RPC 2.0)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mcp_stdio"
path = "src/lib.rs"

[lints.clippy]
# Sidecars depending on this crate MUST NOT write to stdout outside the
# approved MCP framing layer (`docs/specs/mcp-sidecar.md` §"Stdout
# Discipline"). Denying the print macros at the crate level establishes
# the pattern downstream sidecar crates will inherit (workspace-wide
# rollout follows when the first real sidecar crate lands).
print_stdout = "deny"
print_stderr = "deny"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }
