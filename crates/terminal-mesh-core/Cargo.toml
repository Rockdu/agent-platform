[package]
name = "terminal-mesh-core"
version = "0.0.1"
description = "Terminal Mesh portable-pty Tokio actor, 1MB ring buffer, UTF-8/ANSI-safe scanner, OSC agent marker parser, prompt-waiting detector, NeedsAttention dedup arbiter (per docs/specs/terminal-events.md)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "terminal_mesh_core"
path = "src/lib.rs"

[lints.clippy]
# Terminal Mesh actor + downstream sidecar must use the host event bus
# (TerminalEvent envelopes) — never raw stdout/stderr inside the crate.
print_stdout = "deny"
print_stderr = "deny"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
base64 = "0.22"
portable-pty = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
# Used for SIGKILL escalation when portable-pty's ChildKiller (SIGHUP)
# alone fails to terminate a child that traps/ignores HUP. Pinned to
# the same major version src-tauri already uses for sidecar signal
# handling so the workspace shares one nix. The `user` feature gates
# `Uid::current` used by `transport_ssh::init_control_master_dir`.
nix = { version = "0.29", features = ["signal", "process", "user"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time", "test-util"] }
