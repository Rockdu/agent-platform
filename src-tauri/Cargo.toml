[package]
name = "agent-platform"
version = "0.0.1"
description = "MCP-federated personal agent platform (host shell)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "agent_platform_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "agent-platform"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
plugin-codegen = { path = "../crates/plugin-codegen" }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
sha2 = "0.10"
subtle = "2"
base64 = "0.22"
rand = "0.8"
rusqlite = { version = "0.39", features = ["bundled"] }
fs4 = "1"
tauri-plugin-stronghold = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
argon2 = "0.5"
mcp-stdio = { path = "../crates/mcp-stdio" }
terminal-mesh-core = { path = "../crates/terminal-mesh-core" }
tokio = { version = "1", features = ["process", "time", "sync", "io-util", "macros", "rt-multi-thread", "net"] }
nix = { version = "0.29", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"
static_assertions = "1"
