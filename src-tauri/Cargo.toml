[package]
name = "agent-platform"
version = "0.0.1"
description = "MCP-federated personal agent platform (host shell)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "agent_platform_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "agent-platform"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
walkdir = "2"
heck = "0.5"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
