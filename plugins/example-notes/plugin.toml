# Example plugin manifest used by plugin-codegen as a regression probe.
# Round 3: now ships with a real `frontend/index.tsx` + `types.ts` so it
# exercises the full plugin-contract path (manifest + frontend file +
# typed-wrapper generation), not just the scanner.

name = "Notes"
version = "0.0.1"
type = "tab"
command_bin = "notes-plugin"
frontend = "frontend/index.tsx"
permissions = ["notify"]
required_apis = ["invoke", "listen"]
db_namespace = "notes"
migrations_path = "migrations/"

[[commands]]
name = "list_notes"
permissions = []
args_type = "ListNotesArgs"
result_type = "ListNotesResult"

[[commands]]
name = "create_note"
permissions = ["notify"]
args_type = "CreateNoteArgs"
result_type = "CreateNoteResult"
