# Example plugin manifest used by plugin-codegen as a regression probe.
# Has no Rust adapter crate or frontend directory yet; it exists only so the
# scanner has a non-empty input set and the generated artifacts contain real
# values that downstream consumers can grep.

name = "Notes"
version = "0.0.1"
type = "tab"
command_bin = "notes-plugin"
frontend = "frontend/index.tsx"
permissions = ["notify"]
required_apis = ["invoke", "listen"]
db_namespace = "notes"
migrations_path = "migrations/"

[[commands]]
name = "list_notes"
permissions = []

[[commands]]
name = "create_note"
permissions = ["notify"]
